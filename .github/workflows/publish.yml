name: Publish
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npm test
      - run: npx --yes @vscode/vsce@4.0.2 package --no-dependencies
      - run: npx --yes @vscode/vsce@4.0.2 publish --oidc --packagePath soloas-0.2.0.vsix
      - run: npx --yes ovsx publish soloas-0.2.0.vsix -p "$OVSX_PAT"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
      - run: gh release create "$GITHUB_REF_NAME" soloas-0.2.0.vsix --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
