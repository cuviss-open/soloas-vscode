name: Publish
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npm test
      - id: pkg
        run: |
          VSIX="soloas-$(node -p "require('./package.json').version").vsix"
          test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
          npx --yes @vscode/vsce@4.1.0 package --no-dependencies --out "$VSIX"
          echo "vsix=$VSIX" >> "$GITHUB_OUTPUT"
      - run: npx --yes @vscode/vsce@4.1.0 publish --oidc --packagePath "${{ steps.pkg.outputs.vsix }}"
      - run: npx --yes ovsx@1.4.0 publish "${{ steps.pkg.outputs.vsix }}" -p "$OVSX_PAT"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
      - run: gh release create "$GITHUB_REF_NAME" "${{ steps.pkg.outputs.vsix }}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
